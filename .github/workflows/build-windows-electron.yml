name: Build ZIP Image to PDF Chromium v3

on:
  pull_request:
    branches: [main]
    paths:
      - "electron_payload/**"
      - ".github/workflows/build-windows-electron.yml"
      - "BUILD_CHROMIUM_V3.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-portable-exe:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode source package
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(find electron_payload -maxdepth 1 -type f -name 'part-*' | sort)
          test "${#parts[@]}" -eq 3
          cat "${parts[@]}" | tr -d '\r\n' | base64 --decode > source.zip
          echo "ec6e83b27fe5ad0e732dc1ac08f524d2276e19d05e5d42d6553378ef774f82c4  source.zip" | sha256sum --check --strict
          unzip -q source.zip
          test -f windows_chromium_v3/src/main.cjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: windows_chromium_v3/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        working-directory: windows_chromium_v3
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          python -m pip install --disable-pip-version-check pillow
          python tools/create_icon.py

      - name: Unit tests
        working-directory: windows_chromium_v3
        run: npm test

      - name: 1,000 WebP stress test
        working-directory: windows_chromium_v3
        run: npm run stress -- --count 1000 --width 96 --height 128

      - name: Add Windows Sharp runtime
        shell: bash
        working-directory: windows_chromium_v3
        run: |
          set -euo pipefail
          package_file="$(npm pack @img/sharp-win32-x64@0.35.3 --silent)"
          mkdir -p node_modules/@img/sharp-win32-x64
          tar -xzf "$package_file" -C node_modules/@img/sharp-win32-x64 --strip-components=1
          rm -f "$package_file"
          test -f node_modules/@img/sharp-win32-x64/lib/sharp-win32-x64-0.35.3.node
          test -f node_modules/@img/sharp-win32-x64/lib/libvips-42.dll

      - name: Configure Linux cross-build toolchain
        shell: bash
        working-directory: windows_chromium_v3
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          pkg.build = pkg.build || {};
          pkg.build.toolsets = {
            ...(pkg.build.toolsets || {}),
            wine: '1.0.1',
            nsis: '1.2.1'
          };
          pkg.scripts['build:win'] = 'electron-builder --win portable --x64 --publish never';
          fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Build Windows portable EXE
        shell: bash
        working-directory: windows_chromium_v3
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: "true"
        run: npm run build:win

      - name: Verify and assemble release
        shell: bash
        working-directory: windows_chromium_v3
        run: |
          set -euo pipefail
          exe="$(find dist -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -n "$exe"
          python - "$exe" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          data = p.read_bytes()[:64]
          if data[:2] != b'MZ':
              raise SystemExit('Generated file is not a Windows PE executable')
          if p.stat().st_size < 10_000_000:
              raise SystemExit('Generated EXE is unexpectedly small')
          print(f'PE header OK: {p} ({p.stat().st_size} bytes)')
          PY
          mkdir -p release
          cp "$exe" "release/ZIP图片转PDF.exe"
          sha256sum "release/ZIP图片转PDF.exe" > "release/ZIP图片转PDF.exe.sha256"
          printf '%s\n' \
            'ZIP 图片转 PDF 3.0' \
            '平台：Windows x64' \
            '界面：内置 Chromium' \
            '启动：双击 ZIP图片转PDF.exe' \
            '说明：本次仅完成跨平台打包；请在目标 Windows 电脑上进行最终运行验证。' \
            > "release/使用说明.txt"
          ls -lh release

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ZipImageToPDF-Windows-x64-v3.0
          path: windows_chromium_v3/release/*
          if-no-files-found: error
          compression-level: 9
          retention-days: 7
