name: Build Windows ZIP Image to PDF

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout build payload
        uses: actions/checkout@v4

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: payload/part-00

      - name: Decode source package
        shell: pwsh
        run: |
          $parts = Get-ChildItem -Path "payload\part-*" | Sort-Object Name
          if ($parts.Count -ne 9) { throw "Expected 9 source payload parts, found $($parts.Count)." }
          $encoded = ($parts | ForEach-Object { (Get-Content -Raw -Path $_.FullName).Trim() }) -join ""
          [System.IO.File]::WriteAllBytes(
            (Join-Path $PWD "source.zip"),
            [System.Convert]::FromBase64String($encoded)
          )
          $payloadHash = (Get-FileHash "source.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($payloadHash -ne "8f437e06304eff3a408eec3f528a12baea280c83aadd384992c3f962493f7fcf") {
            throw "Decoded source package hash mismatch: $payloadHash"
          }
          Expand-Archive -Path "source.zip" -DestinationPath "src" -Force
          if (-not (Test-Path "src\main.py")) { throw "Decoded source package is invalid." }

      - name: Install build dependencies
        shell: pwsh
        working-directory: src
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip freeze | Out-File -Encoding utf8 "build-dependencies.txt"

      - name: Run unit tests
        shell: pwsh
        working-directory: src
        run: python -m unittest discover -s tests -v

      - name: Verify 1,000 WebP pages
        shell: pwsh
        working-directory: src
        run: python tools/stress_test.py --count 1000 --width 96 --height 128

      - name: Generate Windows icon
        shell: pwsh
        working-directory: src
        run: python tools/create_icon.py

      - name: Build self-contained Windows EXE
        shell: pwsh
        working-directory: src
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --noupx `
            --name ZipImageToPDF `
            --icon "build/app.ico" `
            --version-file "build/version_info.txt" `
            --manifest "build/app.manifest" `
            --collect-all PIL `
            --hidden-import PIL._webp `
            main.py
          if (-not (Test-Path "dist\ZipImageToPDF.exe")) { throw "PyInstaller did not create the EXE." }

      - name: Exercise packaged EXE
        shell: pwsh
        working-directory: src
        run: |
          $testDir = Join-Path $PWD "exe-self-test"
          $process = Start-Process `
            -FilePath "dist\ZipImageToPDF.exe" `
            -ArgumentList @("--self-test", $testDir) `
            -PassThru `
            -Wait
          if ($process.ExitCode -ne 0) {
            if (Test-Path "$testDir\SELF_TEST_FAILED.txt") {
              Get-Content "$testDir\SELF_TEST_FAILED.txt"
            }
            throw "Packaged EXE self-test failed with exit code $($process.ExitCode)."
          }
          if (-not (Test-Path "$testDir\SELF_TEST_OK.txt")) {
            throw "Packaged EXE did not produce its success marker."
          }

      - name: Assemble release package
        shell: pwsh
        working-directory: src
        run: |
          New-Item -ItemType Directory -Force -Path "package" | Out-Null
          Copy-Item "dist\ZipImageToPDF.exe" "package\ZIP图片转PDF.exe"
          Copy-Item "Windows使用说明.txt" "package\使用说明.txt"
          Copy-Item "exe-self-test\SELF_TEST_OK.txt" "package\EXE自检结果.txt"
          Copy-Item "build-dependencies.txt" "package\构建依赖版本.txt"

          $hash = (Get-FileHash "package\ZIP图片转PDF.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ZIP图片转PDF.exe" | Out-File -Encoding ascii "package\ZIP图片转PDF.exe.sha256"
          $size = (Get-Item "package\ZIP图片转PDF.exe").Length
          $builtAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          @"
          ZIP 图片转 PDF 2.0 — Windows 构建验证
          =====================================
          构建时间（UTC）：$builtAt
          架构：Windows x64
          EXE 字节数：$size
          SHA-256：$hash

          已通过：
          - 转换引擎单元测试
          - 1,000 张 WebP → 1,000 页 PDF 压力测试
          - PyInstaller 单文件 EXE 构建
          - 已打包 EXE 的 WebP 解码与 PDF 写入自检
          "@ | Out-File -Encoding utf8 "package\Windows构建验证.txt"

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: ZipImageToPDF-Windows-x64-v2.0
          path: src/package/*
          if-no-files-found: error
          compression-level: 9
          retention-days: 7
